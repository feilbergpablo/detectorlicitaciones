<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0f172a, #1e293b, #0b1120);
        color: white;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        width: 95%;
        max-width: 1200px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        text-align: center;
    }

    .subtitle {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 30px;
        font-size: 1.1rem;
    }

    .status-bar {
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid rgba(34, 197, 94, 0.35);
        color: #86efac;
        padding: 12px;
        border-radius: 14px;
        text-align: center;
        margin-bottom: 30px;
        font-weight: bold;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
    }

    .card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .card h2 {
        margin-bottom: 12px;
        font-size: 1.4rem;
    }

    .card p {
        color: #d1d5db;
        margin-bottom: 18px;
        line-height: 1.5;
    }

    .btn {
        display: inline-block;
        width: 100%;
        text-align: center;
        padding: 14px;
        border-radius: 12px;
        text-decoration: none;
        color: white;
        font-weight: bold;
        font-size: 1rem;
        transition: opacity 0.2s ease;
    }

    .btn:hover {
        opacity: 0.9;
    }

    .btn-green {
        background: linear-gradient(90deg, #22c55e, #16a34a);
    }

    .btn-blue {
        background: linear-gradient(90deg, #3b82f6, #2563eb);
    }

    footer {
        margin-top: 40px;
        text-align: center;
        color: #94a3b8;
        font-size: 0.9rem;
    }

    @media (max-width: 768px) {
        body {
            font-size: 18px;
            padding: 12px;
        }

        h1 {
            font-size: 2.4rem;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.05rem;
            margin-bottom: 24px;
        }

        .container {
            width: 100%;
            padding: 8px;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            padding: 22px;
            border-radius: 20px;
        }

        .card h2 {
            font-size: 1.5rem;
        }

        .card p {
            font-size: 1.05rem;
        }

        .btn {
            font-size: 18px;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
        }

        .status-bar {
            font-size: 1rem;
            padding: 14px;
        }
    }
</style>
